<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code generator</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>


<body>
    <div class="container">
        <h1>QR Code generator</h1>
        <p>
            <em>Generate your own Quick Response Code - <a href="https://goqr.me/api/">https://goqr.me/api/</a></em>
        </p>

        <input type="text" id="text" placeholder="Insert your text" style="width: 500px;" />
        <br>
        <input type="color" id="inputColor" value="#fff" onchange="atualizarCor()" >
        
        <div class="buttons">
            <button onclick="generate();">Generate</button>
        </div>
        <br>
        <div id="qrcodeDiv" class="qrcode-div">
            <img src="" alt="[ Generated QR Code will show up here ]" id="result" style="width: 200px; padding: 30px;">
        </div>


    </div>
</body>

</html>

<script>
    function generate() {
        let size = "200";
        let qrtext = text.value;
        let baseURL = "http://api.qrserver.com/v1/create-qr-code/";
        let bgColor = ""
        for (i = 1; i < inputColor.value.length; i++) {
            bgColor += inputColor.value[i]
        }
        let url = `${baseURL}?data=${qrtext}&size=${size}x${size}&bgcolor=${bgColor}`;
        result.style.backgroundColor = inputColor.value;
        result.src = url;
    };

    function atualizarCor() {
        generate()
    }
</script>
